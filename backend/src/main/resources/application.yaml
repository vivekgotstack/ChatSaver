spring:
  application:
    name: chatsaver-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ChatSaver}
    username: ${DATABASE_USERNAME:chatsaver_app}
    password: ${DATABASE_PASSWORD:ChatSaverLocal_2026_RoyalCrimson_47}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:0}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:3000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_KEEPALIVE_MS:300000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS:true}
  mvc:
    problemdetails:
      enabled: true
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USER}
    password: ${SMTP_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 8000
          timeout: 15000
          writetimeout: 15000

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/problem+json,text/plain,text/css,application/javascript
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

chatsaver:
  web-origin: ${WEB_ORIGIN:http://localhost:3000}
  auth:
    issuer: ${JWT_ISSUER:chatsaver-api}
    secret: ${JWT_SECRET:Vh9qJ2mP7xR4cN8sL1wK6tY3uF0aD5gB9eZ2pQ7rM4nX8jC1vH6kS3yT0iW5oA9d}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
    secure-cookies: ${SECURE_COOKIES:true}
  email:
    sender-email: no-reply@chatsaver.local
    sender-name: ChatSaver

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  lifecycle:
    timeout-per-shutdown-phase: 30s
chatsaver:
  web-origin: ${WEB_ORIGIN}
  auth:
    secret: ${JWT_SECRET}
