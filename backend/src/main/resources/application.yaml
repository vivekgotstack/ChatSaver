spring:
  application:
    name: chatsaver-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ChatSaver}
    username: ${DATABASE_USERNAME:chatsaver_app}
    password: ${DATABASE_PASSWORD:ChatSaverLocal_2026_RoyalCrimson_47}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:0}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:3000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_KEEPALIVE_MS:300000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS:true}
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/problem+json,text/plain,text/css,application/javascript
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

chatsaver:
  web-origin: ${WEB_ORIGIN:http://localhost:3000}
  auth:
    issuer: ${JWT_ISSUER:chatsaver-api}
    secret: ${JWT_SECRET:Vh9qJ2mP7xR4cN8sL1wK6tY3uF0aD5gB9eZ2pQ7rM4nX8jC1vH6kS3yT0iW5oA9d}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
    secure-cookies: ${SECURE_COOKIES:true}
  email:
    brevo-api-key: ${BREVO_API_KEY:}
    sender-email: ${BREVO_SENDER_EMAIL:}
    sender-name: ${BREVO_SENDER_NAME:ChatSaver}
  integrations:
    composio:
      api-key: ${COMPOSIO_API_KEY:}
      api-base-url: ${COMPOSIO_API_BASE_URL:https://backend.composio.dev/api}
      callback-url: ${COMPOSIO_CALLBACK_URL:}
      gmail-version: ${COMPOSIO_GMAIL_VERSION:20260817_00}
      googledrive-version: ${COMPOSIO_GOOGLEDRIVE_VERSION:20260721_00}
      github-version: ${COMPOSIO_GITHUB_VERSION:20260721_00}
      notion-version: ${COMPOSIO_NOTION_VERSION:20260730_00}
      slack-version: ${COMPOSIO_SLACK_VERSION:20260721_00}
      linkedin-version: ${COMPOSIO_LINKEDIN_VERSION:20260724_00}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  lifecycle:
    timeout-per-shutdown-phase: 30s
chatsaver:
  web-origin: ${WEB_ORIGIN}
  auth:
    secret: ${JWT_SECRET}
