[package]
name = "chatsaver"
version = "0.1.0"
description = "ChatSaver desktop application"
authors = ["ChatSaver"]
edition = "2021"

[lib]
name = "chatsaver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-http = { version = "2", features = ["cookies", "unsafe-headers"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
