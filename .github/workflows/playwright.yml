name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: chatsaver
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Build and Start Backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/chatsaver
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: password
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          SMTP_USER: ci
          SMTP_PASS: ci
        run: |
          cd backend
          mvn clean package -DskipTests
          nohup java -jar target/*.jar > ../backend.log 2>&1 &
          cd ..

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --no-audit --no-fund

      - name: Install Playwright Browsers
        run: |
          cd frontend
          npx playwright install --with-deps

      - name: Start Frontend
        run: |
          cd frontend
          nohup npm run dev > ../frontend.log 2>&1 &
          cd ..

      - name: Wait for servers to be ready
        run: npx wait-on tcp:3000 tcp:8080 --timeout 120000

      - name: Run Playwright tests
        env:
          MAILTRAP_API_TOKEN: ${{ secrets.MAILTRAP_API_TOKEN }}
          MAILTRAP_INBOX_ID: ${{ secrets.MAILTRAP_INBOX_ID }}
        run: |
          cd frontend
          if [ -n "$MAILTRAP_API_TOKEN" ] && [ -n "$MAILTRAP_INBOX_ID" ]; then
            npx playwright test
          else
            npx playwright test --grep-invert "Verify successful signup with valid credentials and OTP verification"
          fi

      - name: Print Server Logs on Failure
        if: failure()
        run: |
          echo "=== BACKEND LOGS ==="
          cat backend.log || true
          echo "=== FRONTEND LOGS ==="
          cat frontend.log || true

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: server-logs
          path: |
            backend.log
            frontend.log

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
