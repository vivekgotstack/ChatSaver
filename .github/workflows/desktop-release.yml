name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
            rust-targets: ""
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and publish desktop installer
        working-directory: frontend
        run: npm run tauri -- build ${{ matrix.args }}

      - name: Prepare Windows download
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item frontend/src-tauri/target/release/bundle/nsis/*-setup.exe ChatSaver.exe

      - name: Prepare macOS download
        if: runner.os == 'macOS'
        run: cp frontend/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg ChatSaver.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: ChatSaver.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Publish direct downloads
        uses: softprops/action-gh-release@v2
        with:
          name: ChatSaver Desktop v0.1.0
          body: Direct installers for Windows and macOS. No developer tools are required.
          files: release-assets/*
          fail_on_unmatched_files: true
